[package]
name = "bdwgc-alloc"
version.workspace = true
edition.workspace = true
description = "impl GlobalAlloc and Allocator for bdwgc"
documentation = "https://bdwgc.github.io/bdwgc-rust/bdwgc_alloc/"
repository.workspace = true
license.workspace = true
categories = ["api-bindings", "memory-management", "no-std", "no-std::no-alloc"]

[features]
default = ["autotools"]
autotools = ["bdwgc-alloc-sys/autotools"]
cmake = ["bdwgc-alloc-sys/cmake"]

[[test]]
harness = false
name = "allocator"

[[test]]
harness = false
name = "allocator_api"

[dependencies]
bdwgc-alloc-sys = { path = "../bdwgc-alloc-sys", version = "0.6.16", default-features = false }

[lints]
workspace = true

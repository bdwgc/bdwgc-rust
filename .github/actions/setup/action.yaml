name: setup
description: Sets up a build environment
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: swatinem/rust-cache@v2.9.2
    - uses: homebrew/actions/setup-homebrew@2026.09.28.1
      if: runner.os != 'Windows'
    - run: brew install autoconf automake libtool
      shell: sh
      if: runner.os != 'Windows'

name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
        include:
          - os: windows-latest
            options: --no-default-features --features cmake
          - os: windows-11-arm
            options: --no-default-features --features cmake
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: cargo build ${{ matrix.options }}
  unit_test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
        options:
          -
          - --no-default-features --features cmake
        include:
          - os: windows-latest
            options: --no-default-features --features cmake
          - os: windows-11-arm
            options: --no-default-features --features cmake
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: cargo test ${{ matrix.options }}
  test:
    needs:
      - build
      - unit_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
